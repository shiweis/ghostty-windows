# Lightweight CI for the Windows port, runnable on this fork.
#
# The inherited upstream `test.yml` is gated to `ghostty-org/ghostty` and
# targets paid Namespace runners, so none of it runs here. This workflow
# uses free GitHub-hosted runners (standard runners are free with
# unlimited minutes on public repositories) to give every push and pull
# request a real Windows build + test and a format check.
name: Windows CI

on:
  # Run after merges land on main...
  push:
    branches: [main]
  # ...and on every pull request targeting the repo.
  pull_request: {}
  # Allow manual runs from the Actions tab (once this file is on main).
  workflow_dispatch: {}

# Only keep the latest run per ref; cancel superseded in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # setup-zig caches the global Zig cache (compiler + fetched deps)
      # keyed on build.zig.zon, so repeat runs skip re-downloading deps.
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # Pinned to build.zig.zon's minimum_zig_version.
          version: 0.17.1

      # GitHub-hosted windows-latest runs Windows Defender, whose real-time
      # scanning transiently locks freshly-created files. That makes
      # std.fs.AtomicFile's write->rename fail with AccessDenied (e.g. the
      # ssh-cache DiskCache tests). Exclude the workspace from scanning so the
      # atomic renames succeed.
      - name: Exclude workspace from Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction Stop
            Write-Host "Added Defender exclusion for ${{ github.workspace }}"
          } catch {
            Write-Host "Could not set Defender exclusion (continuing): $_"
          }

      # app-runtime=win32 is this project's native Windows application
      # runtime. We target the GNU ABI because the MSVC ABI can't yet
      # locate the MSVC libc/c++ headers under Zig; this matches the
      # invocation verified on the Windows command-quoting fix.
      - name: Verify shared-desktop input safety
        shell: pwsh
        run: |
          $env:GHOSTTY_TEST_ISOLATED_DESKTOP = "0"
          foreach ($action in @("sendkeys", "sendtext")) {
            $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/win32/test_harness.ps1 -Action $action 2>&1
            if ($LASTEXITCODE -eq 0 -or "$output" -notmatch "Global keyboard injection is disabled") {
              throw "The test harness did not refuse global input ($action)"
            }
          }
          # The refusals are expected failures. GitHub's pwsh wrapper would
          # otherwise propagate the last child process's exit code.
          $global:LASTEXITCODE = 0

      - name: Test PowerShell shell integration (5.1 and 7)
        shell: pwsh
        run: |
          foreach ($engine in @("powershell.exe", "pwsh.exe")) {
            & $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/win32/test_shell_integration.ps1
            if ($LASTEXITCODE -ne 0) {
              throw "Shell integration failed under $engine"
            }
          }

      - name: Test development build installation (5.1 and 7)
        shell: pwsh
        run: |
          foreach ($engine in @("powershell.exe", "pwsh.exe")) {
            & $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/win32/test_dev_install.ps1
            if ($LASTEXITCODE -ne 0) {
              throw "Development build installation failed under $engine"
            }
          }

      - name: Test
        run: .\dist\windows\build.ps1 test -Dapp-runtime=win32 -Dtarget=x86_64-windows-gnu

      # Full app build, which also compiles dist/windows/ghostty.rc.
      - name: Build
        run: .\dist\windows\build.ps1 -Dapp-runtime=win32 -Dtarget=x86_64-windows-gnu

      - name: Build stripped release
        run: .\dist\windows\build.ps1 -Dapp-runtime=win32 -Dtarget=x86_64-windows-gnu -Doptimize=fast

      - name: Verify portable payload and version resources (5.1 and 7)
        shell: pwsh
        run: |
          foreach ($engine in @("powershell.exe", "pwsh.exe")) {
            & $engine -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/win32/test_package.ps1
            if ($LASTEXITCODE -ne 0) {
              throw "Package validation failed under $engine"
            }
          }

      - name: Test cache maintenance helpers
        run: |
          zig test src/build/cache_guard.zig -target x86_64-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'Cache guard tests failed' }
          zig test src/build/cache_prune.zig -target x86_64-windows-gnu
          if ($LASTEXITCODE -ne 0) { throw 'Cache pruning tests failed' }
          python test/win32/test_cache_maintenance.py
          if ($LASTEXITCODE -ne 0) { throw 'Cache maintenance integration tests failed' }

  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Test cache maintenance
        run: |
          zig test src/build/cache_guard.zig
          zig test src/build/cache_prune.zig
          python3 test/win32/test_cache_maintenance.py

      - name: zig fmt
        run: zig fmt --check .

      - name: Test Windows packaging
        run: python3 test/win32/test_package.py
